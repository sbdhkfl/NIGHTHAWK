{% extends "base.html" %}

{% block page_title %}Relationship Graph{% endblock %}

{% block content %}
<section class="card">
  <h2>Relationship Graph — {{ investigation.name }}</h2>
  <p class="muted">Edges are drawn only from collected evidence. No entity is implied to belong to a person without evidence.</p>
  <div id="graph" style="height:600px;width:100%;border:1px solid #30363d;background:#0d1117;margin-top:12px;"></div>
</section>

<script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
<script>
fetch('/investigations/{{ investigation.id }}/graph/data')
  .then(r => r.json())
  .then(data => {
    var container = document.getElementById('graph');
    var nodes = new vis.DataSet(data.nodes.map(n => ({ id: n.id, label: n.label, group: n.type || 'unknown', title: n.type || 'unknown' })));
    var edges = new vis.DataSet(data.edges.map(e => ({ from: e.source, to: e.target, label: e.relation, arrows: 'to', font: { size: 10, align: 'middle' } })));
    new vis.Network(container, {
      nodes: nodes,
      edges: edges
    }, {
      layout: { improvedLayout: true, randomSeed: 2 },
      nodes: {
        shape: 'dot',
        size: 16,
        font: { color: '#c9d1d9', size: 12 },
        color: { border: '#39ff14', background: '#0f1115' }
      },
      edges: {
        color: '#8b949e',
        font: { color: '#8b949e', size: 11, background: 'rgba(15,17,21,0.7)' },
        smooth: { type: 'cubicBezier' }
      },
      groups: {
        domain: { color: { border: '#39ff14' } },
        ip: { color: { border: '#ff7b72' } },
        username: { color: { border: '#1fb6ff' } },
        email: { color: { border: '#d2a8ff' } },
        subdomain: { color: { border: '#ffab70' } },
        image: { color: { border: '#79c0ff' } },
        source: { color: { border: '#8b949e' } }
      },
      physics: { enabled: true, stabilization: true }
    });
  });
</script>
{% endblock %}
