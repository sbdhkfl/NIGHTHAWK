# NIGHTHAWK OSINT docker-compose
# Dashboard is bound to localhost inside the container; map port 8000.
services:
  nighthawk:
    build: .
    container_name: nighthawk-osint
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NIGHTHAWK_HOST=0.0.0.0
      - NIGHTHAWK_PORT=8000
      - NIGHTHAWK_DATABASE_URL=sqlite:////data/nighthawk.db
      - NIGHTHAWK_DATA_DIR=/data
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - HIBP_API_KEY=${HIBP_API_KEY:-}
    volumes:
      - nighthawk_data:/data
    command: nighthawk dashboard

volumes:
  nighthawk_data:
