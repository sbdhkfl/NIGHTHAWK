[project]
name = "nighthawk-osint"
version = "1.0.0"
description = "A modular, cross-platform Open-Source Intelligence gathering and investigation framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "python-whois>=0.9.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "SQLAlchemy>=2.0.29",
    "pydantic>=2.9.0",
    "Pillow>=10.3.0",
    "phonenumbers>=8.13.0",
]
license = {text = "MIT"}
authors = [{name = "NIGHTHAWK OSINT Contributors"}]
keywords = ["osint", "cybersecurity", "investigation", "dns", "whois", "rdap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.scripts]
nighthawk = "nighthawk.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nighthawk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501", "B008"]
