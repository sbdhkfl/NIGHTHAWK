{% extends "base.html" %}

{% block page_title %}New Investigation{% endblock %}

{% block content %}
<section class="card">
  <h2>New Investigation</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form hx-post="/investigations" hx-target="body" hx-swap="innerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label>Investigation name</label>
      <input type="text" name="name" required placeholder="e.g. Acme Corp recon">
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" placeholder="Optional notes">
    </div>
    <button class="btn" type="submit">Create Investigation</button>
  </form>
</section>
{% endblock %}
